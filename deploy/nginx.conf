server {
    listen 80;
    index index.html;
    root /usr/share/nginx/html;

    # Keep redirects relative so a published port or HTTPS proxy is preserved.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /dino.wasm {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
}
