services:
  dino:
    build: .
    restart: unless-stopped
    ports:
      - "${DINO_BIND:-0.0.0.0}:${DINO_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/sem-passaros/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
